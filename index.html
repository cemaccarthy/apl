<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>APL Studio — Dyalog Workbench</title>
<meta name="description" content="A pocket workbench for Dyalog APL: editor, files and a live session, built for iPad.">
<meta name="theme-color" content="#0b1017">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="APL Studio">
<link rel="apple-touch-icon" href="icon-180.png"><!-- see README: generate from icon.svg -->
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-logo" viewBox="0 0 48 48">
      <rect x="5" y="5" width="38" height="38" rx="9" fill="#121a28" stroke="#ffb454" stroke-width="3"/>
      <path d="M12 20h24M12 28h24" stroke="#ffb454" stroke-width="4.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-term" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9l3 3-3 3M12 15h5"/></symbol>
    <symbol id="i-kbd" viewBox="0 0 24 24"><rect x="2.5" y="7" width="19" height="11" rx="2.5"/><path d="M6 10.5h.01M9.5 10.5h.01M13 10.5h.01M16.5 10.5h.01M7 14.5h10"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.4M12 18.8v2.4M4.6 6l1.7 1.4M17.7 16.6l1.7 1.4M2.8 12h2.4M18.8 12h2.4M4.6 18l1.7-1.4M17.7 7.4L19.4 6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2.1 2.1 0 0 1 3 3L8 19l-4 1z"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-7-5 16-3.5-6.5L4 12z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 5l12 7-12 7V5z"/></symbol>
    <symbol id="i-dots" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7V3zM14 3v4h4"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 5v5h5M4.5 10a8 8 0 1 1-1 5"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  </defs>
</svg>

<header id="topbar">
  <div class="tb-left">
    <button class="iconbtn" id="btnFiles" aria-label="Files" aria-pressed="false"><svg><use href="#i-menu"/></svg></button>
    <div id="brand"><svg class="logo"><use href="#i-logo"/></svg>
      <div><span id="brandName">APL Studio</span><span id="brandTag">Dyalog workbench · iPad</span></div>
    </div>
  </div>
  <div class="tb-right">
    <button id="statusChip" class="chip" title="Execution engine"><span class="dot"></span><span id="statusTxt">TryAPL</span></button>
    <button class="btn primary" id="btnRun" title="Run selection or current line (⌘↵)">
      <svg><use href="#i-play"/></svg><span>Run</span><kbd>⌘↵</kbd>
    </button>
    <button class="iconbtn" id="btnRunFile" title="Run entire file (⌘⇧↵)"><svg><use href="#i-file"/></svg></button>
    <span class="tb-sep"></span>
    <button class="iconbtn" id="btnSession" aria-label="Toggle session" aria-pressed="true"><svg><use href="#i-term"/></svg></button>
    <button class="iconbtn" id="btnKbd" aria-label="Toggle glyph keyboard" aria-pressed="true"><svg><use href="#i-kbd"/></svg></button>
    <button class="iconbtn" id="btnTheme" aria-label="Toggle theme"><svg><use href="#i-sun"/></svg></button>
    <button class="iconbtn" id="btnSettings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
  </div>
</header>

<main id="stage">

  <aside id="filesDrawer" aria-label="Files">
    <div class="fd-head">
      <h2>Files</h2>
      <div class="fd-actions">
        <button class="iconbtn" id="btnNewFile" title="New file"><svg><use href="#i-plus"/></svg></button>
        <button class="iconbtn" id="btnImport" title="Import .dyalog / .apl / .txt"><svg><use href="#i-up"/></svg></button>
        <button class="iconbtn" id="btnExportAll" title="Export workspace (JSON)"><svg><use href="#i-down"/></svg></button>
        <button class="iconbtn" id="btnFilesClose" title="Close"><svg><use href="#i-x"/></svg></button>
      </div>
    </div>
    <div class="fd-search"><svg><use href="#i-search"/></svg><input id="fileSearch" type="search" placeholder="Search files…" autocomplete="off"></div>
    <ul id="fileList"></ul>
    <div class="fd-foot">Stored locally in this browser · export to back up.</div>
  </aside>
  <div id="filesBackdrop"></div>

  <section id="editorArea">
    <div id="tabstrip">
      <div id="tabs" role="tablist"></div>
      <button class="iconbtn sm" id="btnSnip" title="Insert snippet"><svg><use href="#i-plus"/></svg><svg class="chev"><use href="#i-chev"/></svg></button>
    </div>
    <div id="views"></div>
    <div id="emptyState" class="hidden">
      <svg class="big"><use href="#i-logo"/></svg>
      <h3>No file open</h3>
      <p>Create a new file or open one from the drawer.</p>
      <div><button class="btn primary" id="btnEmptyNew"><svg><use href="#i-plus"/></svg><span>New file</span></button>
      <button class="btn" id="btnEmptyOpen"><svg><use href="#i-menu"/></svg><span>Open…</span></button></div>
    </div>
    <footer id="statusbar">
      <span id="sbFile">—</span><span id="sbSave"></span><span class="sb-flex"></span><span id="sbPos">Ln 1, Col 1</span>
    </footer>
  </section>

  <aside id="sessionPanel">
    <div class="sp-head">
      <h2>Session</h2>
      <div class="sp-actions">
        <button class="iconbtn" id="btnSessReset" title="Engine )RESET"><svg><use href="#i-reset"/></svg></button>
        <button class="iconbtn" id="btnSessCopy" title="Copy transcript"><svg><use href="#i-copy"/></svg></button>
        <button class="iconbtn" id="btnSessClear" title="Clear transcript"><svg><use href="#i-trash"/></svg></button>
      </div>
    </div>
    <div id="transcript" aria-live="polite"></div>
    <form id="sessForm" autocomplete="off">
      <span class="prompt">›</span>
      <input id="sessInput" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" placeholder="APL expression…">
      <button class="iconbtn" id="btnSend" aria-label="Send"><svg><use href="#i-send"/></svg></button>
    </form>
  </section>
</main>

<footer id="kbd" aria-label="APL glyph keyboard">
  <button id="kbdHandle" aria-label="Toggle keyboard"><span class="grip"></span></button>
  <div id="kbdRows"></div>
</footer>

<div id="popover" class="hidden"></div>
<div id="settingsPop" class="hidden">
  <h3>Settings</h3>
  <label class="srow"><span>Autosave</span><input type="checkbox" id="optAutosave" checked><span class="sw"></span></label>
  <label class="srow"><span>Ctrl+key → glyphs</span><input type="checkbox" id="optCtrl" checked><span class="sw"></span></label>
  <div class="srow"><span>Editor font</span>
    <span class="stepper"><button id="optFontMinus">−</button><b id="optFontVal">16</b><button id="optFontPlus">+</button></span>
  </div>
  <div class="srow col"><span>Execution endpoint</span>
    <input id="optEndpoint" type="url" spellcheck="false">
  </div>
  <div class="srow btns"><button class="btn" id="btnTestEp">Test connection</button><button class="btn" id="btnHelp">Help & shortcuts</button></div>
</div>

<div id="modalRoot"></div>
<div id="toasts"></div>
<input type="file" id="importInput" accept=".dyalog,.apl,.txt,.json" multiple hidden>

<script src="js/app.js" defer></script>
</body>
</html>
